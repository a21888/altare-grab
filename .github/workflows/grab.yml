name: altare-grab

on:
  workflow_dispatch:

concurrency:
  group: altare-grab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grab server
        env:
          ALTARE_TOKEN: ${{ secrets.ALTARE_TOKEN }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          LOCATION: us-lax
          NAME: yg-ubuntu
          EGG_ID: "46"
          MEMORY_MB: "4096"
          DISK_MB: "40960"
          CPU_PERCENT: "125"
          LOOP_SECONDS: "20400"
          INTERVAL_SECONDS: "40"
        run: python3 grab.py
